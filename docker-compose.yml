services:
  lena:
    image: ghcr.io/<owner>/<repo>:latest
    container_name: lena-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data/travel:/app/data/travel:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"