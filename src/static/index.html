<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travel RAG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Outfit:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef3f0;
        --bg-deep: #d9e5df;
        --ink: #1a2a24;
        --muted: #5a6e66;
        --user: #1f4d3a;
        --agent: #ffffff;
        --line: rgba(26, 42, 36, 0.1);
        --accent: #2a7a5c;
        --danger: #a33b3b;
        --shadow: 0 10px 30px rgba(26, 42, 36, 0.08);
        --sidebar: rgba(255, 255, 255, 0.72);
        --sidebar-width: 260px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "IBM Plex Sans KR", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(1200px 600px at 10% -10%, #f7fbf8 0%, transparent 55%),
          radial-gradient(900px 500px at 100% 0%, #d7ebe2 0%, transparent 50%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      }

      .shell {
        display: grid;
        grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
        width: 100%;
        height: 100%;
        height: 100dvh;
        margin: 0;
      }

      .sidebar {
        position: sticky;
        top: 0;
        left: 0;
        align-self: start;
        width: var(--sidebar-width);
        height: 100dvh;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 20px 14px;
        border-right: 1px solid var(--line);
        background: var(--sidebar);
        backdrop-filter: blur(10px);
        min-height: 0;
        z-index: 2;
      }

      .sidebar-top {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .sidebar-label {
        font-size: 0.78rem;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .new-session {
        border: none;
        background: var(--accent);
        color: white;
        font: inherit;
        font-weight: 500;
        border-radius: 12px;
        padding: 12px 14px;
        cursor: pointer;
      }

      .new-session:hover {
        opacity: 0.92;
      }

      .session-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .session-item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: start;
        width: 100%;
        border: 1px solid transparent;
        background: transparent;
        border-radius: 12px;
        padding: 10px;
        text-align: left;
        cursor: pointer;
        font: inherit;
        color: inherit;
      }

      .session-item:hover {
        background: rgba(255, 255, 255, 0.7);
      }

      .session-item.active {
        background: #fff;
        border-color: rgba(42, 122, 92, 0.25);
        box-shadow: var(--shadow);
      }

      .session-title {
        font-weight: 500;
        font-size: 0.92rem;
        line-height: 1.35;
      }

      .session-meta {
        margin-top: 4px;
        font-size: 0.75rem;
        color: var(--muted);
      }

      .session-delete {
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 0.78rem;
        padding: 4px 6px;
        border-radius: 8px;
      }

      .session-delete:hover {
        color: var(--danger);
        background: rgba(163, 59, 59, 0.08);
      }

      .app {
        min-width: 0;
        width: 100%;
        max-width: 760px;
        height: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        padding: 28px 20px 20px;
        overflow: hidden;
      }

      header {
        flex-shrink: 0;
        margin-bottom: 16px;
        animation: rise 0.5s ease both;
      }

      .brand {
        font-family: "Outfit", sans-serif;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin: 0;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .chat {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 8px 2px 18px;
      }

      .bubble {
        max-width: 88%;
        padding: 14px 16px;
        line-height: 1.55;
        font-size: 0.98rem;
        white-space: pre-wrap;
        word-break: break-word;
        animation: rise 0.35s ease both;
      }

      .bubble.user {
        align-self: flex-end;
        background: var(--user);
        color: #f4faf7;
        border-radius: 18px 18px 4px 18px;
      }

      .bubble.agent {
        align-self: flex-start;
        background: var(--agent);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        border-radius: 18px 18px 18px 4px;
      }

      .bubble.agent.error {
        color: var(--danger);
        border-color: rgba(163, 59, 59, 0.25);
      }

      .bubble.typing {
        color: var(--muted);
      }

      .empty {
        margin: auto;
        text-align: center;
        color: var(--muted);
        animation: rise 0.5s ease 0.1s both;
      }

      .empty p {
        margin: 0;
        font-size: 0.95rem;
      }

      .composer {
        flex-shrink: 0;
        display: flex;
        gap: 10px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        background: linear-gradient(
          180deg,
          rgba(238, 243, 240, 0) 0%,
          rgba(217, 229, 223, 0.85) 35%
        );
        animation: rise 0.5s ease 0.15s both;
      }

      .composer input {
        flex: 1;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.85);
        border-radius: 14px;
        padding: 14px 16px;
        font: inherit;
        color: var(--ink);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .composer input:focus {
        border-color: rgba(42, 122, 92, 0.45);
        box-shadow: 0 0 0 3px rgba(42, 122, 92, 0.12);
      }

      .composer button {
        border: none;
        background: var(--accent);
        color: white;
        font: inherit;
        font-weight: 500;
        border-radius: 14px;
        padding: 0 18px;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .composer button:hover:not(:disabled) {
        transform: translateY(-1px);
      }

      .composer button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 840px) {
        .shell {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }

        .sidebar {
          position: sticky;
          top: 0;
          width: 100%;
          height: auto;
          max-height: 220px;
          border-right: none;
          border-bottom: 1px solid var(--line);
        }

        .app {
          max-width: none;
          padding: 16px 14px 14px;
        }

        .brand {
          font-size: 1.7rem;
        }

        .bubble {
          max-width: 94%;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="sidebar-top">
          <div class="sidebar-label">여행 세션</div>
          <button type="button" class="new-session" id="newSession">새 여행 시작</button>
        </div>
        <div class="session-list" id="sessionList"></div>
      </aside>

      <div class="app">
        <header>
          <h1 class="brand">Travel RAG</h1>
          <p class="subtitle" id="subtitle">여행별로 대화를 나눠 이어갈 수 있습니다.</p>
        </header>

        <main id="chat" class="chat" aria-live="polite">
          <div class="empty" id="empty">
            <p>새 여행을 만들거나 왼쪽에서 세션을 선택하세요.</p>
          </div>
        </main>

        <form class="composer" id="form">
          <input
            id="question"
            type="text"
            placeholder="질문을 입력하세요"
            autocomplete="off"
            required
          />
          <button type="submit" id="send">보내기</button>
        </form>
      </div>
    </div>

    <script>
      const chat = document.getElementById("chat");
      const form = document.getElementById("form");
      const input = document.getElementById("question");
      const send = document.getElementById("send");
      const sessionList = document.getElementById("sessionList");
      const newSessionBtn = document.getElementById("newSession");
      const subtitle = document.getElementById("subtitle");

      let currentSessionId = localStorage.getItem("travelSessionId") || null;
      let busy = false;

      function setBusy(next) {
        busy = next;
        input.disabled = next || !currentSessionId;
        send.disabled = next || !currentSessionId;
        newSessionBtn.disabled = next;
      }

      function clearChat() {
        chat.innerHTML = "";
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.id = "empty";
        empty.innerHTML = "<p>예: 제주 2박3일 자연 경관 위주로 짜줘</p>";
        chat.appendChild(empty);
      }

      function addBubble(text, role, extraClass = "") {
        const empty = document.getElementById("empty");
        if (empty) empty.remove();
        const el = document.createElement("div");
        el.className = `bubble ${role}${extraClass ? " " + extraClass : ""}`;
        el.textContent = text;
        chat.appendChild(el);
        chat.scrollTop = chat.scrollHeight;
        return el;
      }

      function renderMessages(messages) {
        chat.innerHTML = "";
        if (!messages || messages.length === 0) {
          clearChat();
          return;
        }
        for (const message of messages) {
          addBubble(
            message.content,
            message.role === "user" ? "user" : "agent"
          );
        }
      }

      function formatMeta(session) {
        const parts = [];
        if (session.destination) parts.push(session.destination);
        if (session.days) parts.push(`${session.days}일`);
        if (typeof session.message_count === "number") {
          parts.push(`메시지 ${session.message_count}`);
        }
        return parts.join(" · ") || "새 대화";
      }

      function renderSessions(sessions) {
        sessionList.innerHTML = "";
        if (!sessions.length) {
          const empty = document.createElement("div");
          empty.className = "session-meta";
          empty.style.padding = "8px";
          empty.textContent = "아직 세션이 없습니다.";
          sessionList.appendChild(empty);
          return;
        }

        for (const session of sessions) {
          const row = document.createElement("div");
          row.className =
            "session-item" +
            (session.id === currentSessionId ? " active" : "");

          const main = document.createElement("button");
          main.type = "button";
          main.style.all = "unset";
          main.style.cursor = "pointer";
          main.style.display = "block";
          main.style.width = "100%";
          main.innerHTML = `
            <div class="session-title"></div>
            <div class="session-meta"></div>
          `;
          main.querySelector(".session-title").textContent = session.title;
          main.querySelector(".session-meta").textContent = formatMeta(session);
          main.addEventListener("click", () => selectSession(session.id));

          const del = document.createElement("button");
          del.type = "button";
          del.className = "session-delete";
          del.textContent = "삭제";
          del.addEventListener("click", (event) => {
            event.stopPropagation();
            deleteSession(session.id, session.title);
          });

          row.appendChild(main);
          row.appendChild(del);
          sessionList.appendChild(row);
        }
      }

      async function refreshSessions() {
        const response = await fetch("/travel/sessions");
        if (!response.ok) throw new Error("세션 목록을 불러오지 못했습니다.");
        const sessions = await response.json();
        renderSessions(sessions);
        return sessions;
      }

      async function selectSession(sessionId, options = {}) {
        const force = Boolean(options.force);
        if (busy && !force) return;
        currentSessionId = sessionId;
        localStorage.setItem("travelSessionId", sessionId);
        setBusy(true);
        try {
          const response = await fetch(`/travel/sessions/${sessionId}`);
          if (!response.ok) throw new Error("세션을 불러오지 못했습니다.");
          const detail = await response.json();
          // Ignore stale responses if the user switched sessions meanwhile.
          if (currentSessionId !== sessionId) return;
          subtitle.textContent = detail.destination
            ? `${detail.title} · ${detail.destination}`
            : detail.title;
          renderMessages(detail.messages || []);
          await refreshSessions();
        } catch (error) {
          if (currentSessionId !== sessionId) return;
          clearChat();
          addBubble(
            error instanceof Error ? error.message : "세션 로드 실패",
            "agent",
            "error"
          );
        } finally {
          if (currentSessionId === sessionId) {
            setBusy(false);
            input.focus();
          }
        }
      }

      async function createSession() {
        if (busy) return;
        setBusy(true);
        try {
          const response = await fetch("/travel/sessions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({}),
          });
          if (!response.ok) throw new Error("세션 생성 실패");
          const session = await response.json();
          currentSessionId = session.id;
          localStorage.setItem("travelSessionId", session.id);
          subtitle.textContent = session.title;
          clearChat();
          await refreshSessions();
        } catch (error) {
          addBubble(
            error instanceof Error ? error.message : "세션 생성 실패",
            "agent",
            "error"
          );
        } finally {
          setBusy(false);
          input.focus();
        }
      }

      async function deleteSession(sessionId, title) {
        if (busy) return;
        const ok = window.confirm(`"${title}" 세션을 삭제할까요?`);
        if (!ok) return;
        setBusy(true);
        try {
          const response = await fetch(`/travel/sessions/${sessionId}`, {
            method: "DELETE",
          });
          if (!response.ok) throw new Error("세션 삭제 실패");
          if (currentSessionId === sessionId) {
            currentSessionId = null;
            localStorage.removeItem("travelSessionId");
            subtitle.textContent = "여행별로 대화를 나눠 이어갈 수 있습니다.";
            clearChat();
          }
          const sessions = await refreshSessions();
          if (!currentSessionId && sessions.length) {
            await selectSession(sessions[0].id, { force: true });
          } else {
            setBusy(false);
          }
        } catch (error) {
          addBubble(
            error instanceof Error ? error.message : "세션 삭제 실패",
            "agent",
            "error"
          );
          setBusy(false);
        }
      }

      newSessionBtn.addEventListener("click", createSession);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const question = input.value.trim();
        if (!question || busy) return;

        if (!currentSessionId) {
          await createSession();
          if (!currentSessionId) return;
        }

        addBubble(question, "user");
        input.value = "";
        setBusy(true);
        const pending = addBubble("답변을 작성하는 중…", "agent", "typing");

        try {
          const response = await fetch(
            `/travel/sessions/${currentSessionId}/query`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ question }),
            }
          );

          if (!response.ok) {
            throw new Error(`요청 실패 (${response.status})`);
          }

          const data = await response.json();
          pending.classList.remove("typing");
          pending.textContent = data.answer || "답변을 받지 못했습니다.";
          if (data.session?.title) {
            subtitle.textContent = data.session.destination
              ? `${data.session.title} · ${data.session.destination}`
              : data.session.title;
          }
          await refreshSessions();
        } catch (error) {
          pending.classList.remove("typing");
          pending.classList.add("error");
          pending.textContent =
            error instanceof Error
              ? `오류: ${error.message}`
              : "알 수 없는 오류가 발생했습니다.";
        } finally {
          setBusy(false);
          input.focus();
          chat.scrollTop = chat.scrollHeight;
        }
      });

      (async function init() {
        try {
          const sessions = await refreshSessions();
          if (
            currentSessionId &&
            sessions.some((session) => session.id === currentSessionId)
          ) {
            await selectSession(currentSessionId, { force: true });
          } else if (sessions.length) {
            await selectSession(sessions[0].id, { force: true });
          } else {
            currentSessionId = null;
            clearChat();
            setBusy(false);
          }
        } catch (error) {
          addBubble(
            error instanceof Error ? error.message : "초기화 실패",
            "agent",
            "error"
          );
          setBusy(false);
        }
      })();
    </script>
  </body>
</html>
