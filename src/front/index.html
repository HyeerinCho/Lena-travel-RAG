<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travel RAG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Outfit:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef1f6;
        --bg-deep: #dce2ec;
        --ink: #3a4a5c;
        --muted: #748da6;
        --user: #748da6;
        --agent: #ffffff;
        --line: rgba(116, 141, 166, 0.2);
        --accent: #748da6;
        --accent-strong: #5f7791;
        --danger: #b0555f;
        --shadow: 0 10px 30px rgba(116, 141, 166, 0.22);
        --sidebar: rgba(255, 255, 255, 0.72);
        --sidebar-width: 260px;
        --warn: #a07a3a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "IBM Plex Sans KR", sans-serif;
        color: var(--ink);
        background: linear-gradient(180deg, var(--bg) 0%, var(--bg-deep) 100%);
      }

      .shell {
        display: grid;
        grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
        width: 100%;
        height: 100%;
        height: 100dvh;
        margin: 0;
      }

      .sidebar {
        position: sticky;
        top: 0;
        left: 0;
        align-self: start;
        width: var(--sidebar-width);
        height: 100dvh;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 20px 14px;
        border-right: 1px solid var(--line);
        background: var(--sidebar);
        backdrop-filter: blur(10px);
        min-height: 0;
        z-index: 2;
      }

      .sidebar-top {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .sidebar-label {
        font-size: 0.78rem;
        color: var(--muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .new-session {
        border: none;
        background: var(--accent);
        color: white;
        font: inherit;
        font-weight: 500;
        border-radius: 12px;
        padding: 12px 14px;
        cursor: pointer;
      }

      .new-session:hover {
        background: var(--accent-strong);
      }

      .session-list {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .session-item {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: start;
        width: 100%;
        border: 1px solid transparent;
        background: transparent;
        border-radius: 12px;
        padding: 10px;
        text-align: left;
        cursor: pointer;
        font: inherit;
        color: inherit;
      }

      .session-item:hover {
        background: rgba(255, 255, 255, 0.7);
      }

      .session-item.active {
        background: #fff;
        border-color: rgba(116, 141, 166, 0.25);
        box-shadow: var(--shadow);
      }

      .session-title {
        font-weight: 500;
        font-size: 0.92rem;
        line-height: 1.35;
      }

      .session-meta {
        margin-top: 4px;
        font-size: 0.75rem;
        color: var(--muted);
      }

      .session-delete {
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 0.78rem;
        padding: 4px 6px;
        border-radius: 8px;
      }

      .session-delete:hover {
        color: var(--danger);
        background: rgba(176, 85, 95, 0.08);
      }

      .app {
        min-width: 0;
        width: 100%;
        max-width: 760px;
        height: 100%;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        padding: 28px 20px 20px;
        overflow: hidden;
      }

      header {
        flex-shrink: 0;
        margin-bottom: 12px;
        animation: rise 0.5s ease both;
      }

      .brand {
        font-family: "Outfit", sans-serif;
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        margin: 0;
      }

      .subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .meta-editor {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.65);
        display: none;
        gap: 8px;
        flex-wrap: wrap;
      }

      .meta-editor.open {
        display: flex;
      }

      .meta-editor label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 0.75rem;
        color: var(--muted);
        min-width: 110px;
        flex: 1;
      }

      .meta-editor input,
      .meta-editor select {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        font: inherit;
        color: var(--ink);
        background: #fff;
      }

      .meta-actions {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        width: 100%;
      }

      .ghost-btn,
      .text-btn {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.8);
        color: var(--ink);
        font: inherit;
        font-size: 0.85rem;
        border-radius: 10px;
        padding: 8px 12px;
        cursor: pointer;
      }

      .text-btn {
        border: none;
        background: transparent;
        color: var(--accent);
        padding: 4px 0;
      }

      .primary-btn {
        border: none;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 0.85rem;
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
      }

      .chat {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow-x: hidden;
        overflow-y: auto;
        padding: 8px 2px 18px;
        scrollbar-color: rgba(58, 74, 92, 0.25) transparent;
      }

      .chat::-webkit-scrollbar {
        width: 8px;
        background: transparent;
      }

      .chat::-webkit-scrollbar-track {
        background: transparent;
      }

      .chat::-webkit-scrollbar-thumb {
        background: rgba(58, 74, 92, 0.25);
        border-radius: 8px;
      }

      .bubble {
        max-width: 88%;
        padding: 14px 16px;
        line-height: 1.55;
        font-size: 0.98rem;
        white-space: pre-wrap;
        word-break: break-word;
        animation: rise 0.35s ease both;
      }

      .bubble.user {
        align-self: flex-end;
        background: var(--user);
        color: #f4faf7;
        border-radius: 18px 18px 4px 18px;
      }

      .bubble.agent {
        align-self: flex-start;
        background: var(--agent);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        border-radius: 18px 18px 18px 4px;
        white-space: normal;
      }

      .bubble.agent .answer-text {
        word-break: break-word;
      }

      .answer-text > *:first-child {
        margin-top: 0;
      }

      .answer-text > *:last-child {
        margin-bottom: 0;
      }

      .answer-text p {
        margin: 0.5em 0;
      }

      .answer-text h3,
      .answer-text h4,
      .answer-text h5,
      .answer-text h6 {
        margin: 0.7em 0 0.35em;
        font-size: 1rem;
        font-weight: 600;
      }

      .answer-text ul,
      .answer-text ol {
        margin: 0.4em 0;
        padding-left: 1.3em;
      }

      .answer-text li {
        margin: 0.2em 0;
      }

      .answer-text code {
        background: rgba(116, 141, 166, 0.14);
        border-radius: 5px;
        padding: 1px 5px;
        font-size: 0.9em;
      }

      .answer-text a {
        color: var(--accent);
      }

      .bubble.agent.error {
        color: var(--danger);
        border-color: rgba(176, 85, 95, 0.25);
      }

      .bubble.typing {
        color: var(--muted);
      }

      .typing-stepper {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .stepper-steps {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .step {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 0.85rem;
        color: var(--muted);
        opacity: 0.55;
        transition: opacity 0.25s ease, color 0.25s ease;
      }

      .step .step-marker {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 2px solid rgba(116, 141, 166, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.6rem;
        color: #fff;
        background: transparent;
        transition: background 0.25s ease, border-color 0.25s ease;
      }

      .step.active {
        opacity: 1;
        color: var(--ink);
        font-weight: 600;
      }

      .step.active .step-marker {
        border-color: var(--accent);
        background: var(--accent);
        animation: pulse 1.1s ease-in-out infinite;
      }

      .step.done {
        opacity: 0.85;
        color: var(--muted);
      }

      .step.done .step-marker {
        border-color: var(--accent);
        background: var(--accent);
      }

      .typing-dots {
        display: inline-flex;
        gap: 4px;
        padding-left: 25px;
      }

      .typing-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        animation: bounce 1s ease-in-out infinite;
      }

      .typing-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .typing-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.5;
        }
        40% {
          transform: translateY(-5px);
          opacity: 1;
        }
      }

      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(116, 141, 166, 0.45);
        }
        50% {
          box-shadow: 0 0 0 5px rgba(116, 141, 166, 0);
        }
      }

      .plan {
        margin-top: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .plan-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .export-toolbar {
        display: flex;
        justify-content: flex-end;
        gap: 4px;
        margin-top: 4px;
      }

      .export-btn {
        border: none;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 0.72rem;
        letter-spacing: 0.02em;
        border-radius: 7px;
        padding: 3px 7px;
        cursor: pointer;
        opacity: 0.6;
        transition: opacity 0.15s ease, background 0.15s ease, color 0.15s ease;
      }

      .export-btn:hover {
        opacity: 1;
        color: var(--accent);
        background: rgba(116, 141, 166, 0.12);
      }

      .weather-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 10px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.6);
        border: 1px solid var(--line);
      }

      .weather-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 10px;
        background: #fff;
        border: 1px solid var(--line);
        font-size: 0.82rem;
      }

      .weather-chip .wx-icon {
        font-size: 1.15rem;
        line-height: 1;
      }

      .weather-chip .wx-day {
        font-weight: 600;
      }

      .weather-chip .wx-temp {
        color: var(--muted);
      }

      .weather-chip.rain {
        border-color: #9bbcf0;
        background: #f0f6ff;
      }

      .day-weather {
        margin-left: 8px;
        font-size: 0.8rem;
        color: var(--muted);
        font-weight: 500;
      }

      .itinerary-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        border: none;
        background: transparent;
        padding: 4px 0;
        margin: 0;
        font: inherit;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }

      .itinerary-toggle:hover .day-title {
        color: var(--accent);
      }

      .day-chevron {
        flex-shrink: 0;
        width: 1em;
        color: var(--muted);
        font-size: 0.75rem;
        transition: transform 0.15s ease;
      }

      .itinerary-block.open .day-chevron {
        transform: rotate(90deg);
      }

      .itinerary-body {
        display: none;
        padding: 4px 0 2px 1.4em;
      }

      .itinerary-block.open .itinerary-body {
        display: block;
      }

      .day-block {
        padding-top: 8px;
        border-top: 1px solid var(--line);
      }

      .day-header {
        padding: 4px 0;
      }

      .day-mood {
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 8px 0 10px;
        padding: 12px 14px 12px 18px;
        border-radius: 14px;
        color: #fff;
        box-shadow: var(--shadow);
        animation: rise 0.35s ease both;
      }

      .day-mood::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          rgba(255, 255, 255, 0.16) 1px,
          transparent 1px
        );
        background-size: 12px 12px;
        opacity: 0.55;
        pointer-events: none;
      }

      .mood-accent {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 5px;
        border-radius: 14px 0 0 14px;
        z-index: 1;
      }

      .mood-watermark {
        position: absolute;
        right: -8px;
        bottom: -16px;
        font-size: 4.4rem;
        line-height: 1;
        opacity: 0.16;
        transform: rotate(-8deg);
        pointer-events: none;
        z-index: 0;
      }

      .day-mood .mood-emoji {
        position: relative;
        z-index: 2;
        font-size: 1.7rem;
        line-height: 1;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.18));
      }

      .day-mood .mood-text {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .day-mood .mood-label {
        font-weight: 600;
        font-size: 0.9rem;
      }

      .day-mood .mood-sub {
        font-size: 0.75rem;
        opacity: 0.92;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .day-title {
        font-weight: 600;
        font-size: 0.92rem;
        flex: 1;
      }

      .day-body {
        display: block;
        padding: 4px 0 2px 0;
      }

      .day-actions {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 6px;
      }

      .slot-timeline {
        position: relative;
        padding-left: 22px;
      }

      .slot-timeline::before {
        content: "";
        position: absolute;
        left: 6px;
        top: 14px;
        bottom: 14px;
        width: 2px;
        border-radius: 2px;
        background: linear-gradient(
          180deg,
          rgba(116, 141, 166, 0.15),
          rgba(116, 141, 166, 0.45)
        );
      }

      .slot {
        position: relative;
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 8px;
        padding: 8px 0;
        font-size: 0.9rem;
        animation: slotIn 0.4s ease both;
      }

      .slot::before {
        content: "";
        position: absolute;
        left: -19px;
        top: 11px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #fff;
        border: 2.5px solid var(--accent);
        box-shadow: 0 0 0 3px rgba(116, 141, 166, 0.14);
      }

      .slot-time {
        color: var(--accent);
        font-size: 0.72rem;
        font-weight: 600;
        align-self: start;
        letter-spacing: 0.02em;
      }

      .slot-place {
        border: none;
        background: none;
        padding: 0;
        font: inherit;
        color: var(--ink);
        text-align: left;
        cursor: default;
      }

      .slot-place.clickable {
        color: var(--accent);
        cursor: pointer;
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .slot-note {
        grid-column: 2;
        color: var(--muted);
        font-size: 0.8rem;
      }

      @keyframes slotIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .warnings {
        color: var(--warn);
        font-size: 0.85rem;
      }

      .warnings ul,
      .sources {
        margin: 4px 0 0;
        padding-left: 18px;
      }

      .sources {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        list-style: none;
        padding-left: 0;
      }

      .source-chip {
        font-size: 0.75rem;
        color: var(--muted);
        background: rgba(116, 141, 166, 0.08);
        border-radius: 8px;
        padding: 4px 8px;
      }

      .source-chip.clickable {
        color: var(--accent);
        cursor: pointer;
      }

      .source-chip.clickable:hover {
        background: rgba(116, 141, 166, 0.18);
      }

      .city-list {
        list-style: none;
        margin: 4px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .city-item {
        border: 1px solid rgba(116, 141, 166, 0.18);
        border-radius: 12px;
        padding: 12px 14px;
        background: rgba(116, 141, 166, 0.04);
      }

      .city-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }

      .city-name {
        font-weight: 700;
        font-size: 0.98rem;
      }

      .city-merit {
        margin-top: 4px;
        font-size: 0.85rem;
        color: var(--muted);
        line-height: 1.4;
      }

      .city-places {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .city-place-empty {
        color: var(--muted);
        font-size: 0.85rem;
      }

      .stay-block {
        margin-top: 10px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(116, 141, 166, 0.08);
        border: 1px solid rgba(116, 141, 166, 0.18);
      }

      .stay-title {
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .stay-list {
        margin: 0;
        padding-left: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .stay-item {
        font-size: 0.85rem;
        line-height: 1.4;
      }

      .stay-name {
        font-weight: 600;
      }

      .stay-name.clickable {
        cursor: pointer;
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 2px;
      }

      .stay-meta {
        color: var(--muted);
      }

      .empty {
        margin: auto;
        text-align: center;
        color: var(--muted);
        animation: rise 0.5s ease 0.1s both;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 20px;
      }

      .empty p {
        margin: 0;
        font-size: 0.95rem;
      }

      .empty-illustration {
        position: relative;
        width: 128px;
        height: 128px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .empty-blob {
        position: absolute;
        inset: 0;
        border-radius: 46% 54% 58% 42% / 52% 44% 56% 48%;
        background: linear-gradient(135deg, #9cb4cc, #748da6);
        opacity: 0.28;
        filter: blur(2px);
        animation: blobFloat 6s ease-in-out infinite;
      }

      .empty-emoji {
        position: relative;
        font-size: 3.4rem;
        animation: float 4s ease-in-out infinite;
      }

      .empty-title {
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--ink);
      }

      .example-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        max-width: 420px;
      }

      .example-chip {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.7);
        color: var(--ink);
        font: inherit;
        font-size: 0.82rem;
        border-radius: 999px;
        padding: 7px 14px;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease,
          border-color 0.15s ease;
      }

      .example-chip:hover {
        transform: translateY(-1px);
        background: #fff;
        border-color: rgba(116, 141, 166, 0.4);
        color: var(--accent);
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      @keyframes blobFloat {
        0%,
        100% {
          transform: translateY(0) rotate(0deg) scale(1);
          border-radius: 46% 54% 58% 42% / 52% 44% 56% 48%;
        }
        50% {
          transform: translateY(-6px) rotate(6deg) scale(1.05);
          border-radius: 54% 46% 42% 58% / 44% 56% 48% 52%;
        }
      }

      .composer {
        flex-shrink: 0;
        display: flex;
        gap: 10px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
        background: linear-gradient(
          180deg,
          rgba(220, 226, 236, 0) 0%,
          rgba(220, 226, 236, 0.85) 35%
        );
        animation: rise 0.5s ease 0.15s both;
      }

      .composer input {
        flex: 1;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.85);
        border-radius: 14px;
        padding: 14px 16px;
        font: inherit;
        color: var(--ink);
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .composer input:focus {
        border-color: rgba(116, 141, 166, 0.45);
        box-shadow: 0 0 0 3px rgba(116, 141, 166, 0.12);
      }

      .composer button {
        border: none;
        background: var(--accent);
        color: white;
        font: inherit;
        font-weight: 500;
        border-radius: 14px;
        padding: 0 18px;
        cursor: pointer;

      }

        transform: translateY(-1px);
        background: var(--accent-strong);
      }

        opacity: 0.55;
        cursor: not-allowed;
      }

      .drawer-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(58, 74, 92, 0.28);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
        z-index: 20;
      }

      .drawer-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }

      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        width: min(380px, 92vw);
        height: 100dvh;
        background: #fff;
        box-shadow: -12px 0 40px rgba(58, 74, 92, 0.12);
        transform: translateX(100%);
        transition: transform 0.25s ease;
        z-index: 21;
        padding: 24px 20px;
        overflow-y: auto;
      }

        transform: translateX(0);
      }

      .drawer h2 {
        margin: 0 0 12px;
        font-family: "Outfit", sans-serif;
        font-size: 1.25rem;
      }

      .drawer dl {
        margin: 0;
        display: grid;
        gap: 10px;
      }

      .drawer dt {
        font-size: 0.75rem;
        color: var(--muted);
      }

      .drawer dd {
        margin: 2px 0 0;
        font-size: 0.92rem;
        white-space: pre-wrap;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }

      @media (max-width: 840px) {
        .shell {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }

        .sidebar {
          position: sticky;

          border-bottom: 1px solid var(--line);

          max-width: none;
          padding: 16px 14px 14px;
        }

        .brand {
          font-size: 1.7rem;
        }

        .bubble {
          max-width: 94%;
        }
      }
    </style>

    <div class="shell">

      function buildTypingStepper() {
        const wrap = document.createElement("div");
        wrap.className = "typing-stepper";

        steps.className = "stepper-steps";
        wrap.appendChild(steps);

      // 단계는 수신한 순서대로 동적으로 쌓인다. 새 stage가 오면 이전 단계는 done,
      // 현재 단계는 active로 표시한다. (일정 vs 가부 질문에 따라 단계 구성이 달라짐)
      function setStepperStage(stepper, stage) {
        if (!stepper || !stage) return;
        const stepsEl = stepper.querySelector(".stepper-steps");
        if (!stepsEl) return;
        let step = stepsEl.querySelector(`.step[data-stage="${stage}"]`);
        if (!step) {
          step = document.createElement("div");
          step.className = "step";
          step.dataset.stage = stage;
          const marker = document.createElement("span");
          marker.className = "step-marker";
          marker.textContent = "✓";
          const label = document.createElement("span");
          label.textContent = STEP_TITLE[stage] || "처리 중";
          step.appendChild(marker);
          step.appendChild(label);
          stepsEl.appendChild(step);
        }
        stepsEl.querySelectorAll(".step").forEach((el) => {
          el.classList.remove("active", "done");
          el.classList.add(el === step ? "active" : "done");
        });
      }

      const prefersReducedMotion =
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const CONFETTI_COLORS = ["#748da6", "#9cb4cc", "#d3cedf", "#f2d7d9"];

      function fireConfetti() {
        if (prefersReducedMotion) return;
        const canvas = document.createElement("canvas");
        canvas.style.cssText =
          "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60;";
        document.body.appendChild(canvas);
        const ctx = canvas.getContext("2d");
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        ctx.scale(dpr, dpr);
        const W = window.innerWidth;
        const originX = W / 2;
        const count = 130;
        const parts = [];
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * (0.15 + Math.random() * 0.7)) * -1;
          const speed = 6 + Math.random() * 7;
          parts.push({
            x: originX + (Math.random() - 0.5) * 160,
            y: 90 + Math.random() * 40,
            vx: Math.cos(angle) * speed * (Math.random() < 0.5 ? -1 : 1),
            vy: Math.sin(angle) * speed - 2,
            size: 5 + Math.random() * 6,
            color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
            rot: Math.random() * Math.PI,
            vr: (Math.random() - 0.5) * 0.3,
          });
        }
        const start = performance.now();
        const duration = 1500;
        function frame(now) {
          const elapsed = now - start;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const fade = Math.max(0, 1 - elapsed / duration);
          for (const p of parts) {
            p.vy += 0.22;
            p.x += p.vx;
            p.y += p.vy;
            p.rot += p.vr;
            ctx.save();
            ctx.globalAlpha = fade;
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            ctx.restore();
          }
          if (elapsed < duration) {
            requestAnimationFrame(frame);
          } else {
            canvas.remove();
          }
        }
        requestAnimationFrame(frame);
      }

      function setBusy(next) {
        busy = next;
        input.disabled = next || !currentSessionId;
        send.disabled = next || !currentSessionId;
        newSessionBtn.disabled = next;
      }

      const EXAMPLE_QUESTIONS = [
        "제주 2박3일 자연 경관 위주로 짜줘",
        "부산 1박2일 맛집 코스 추천",

      function clearChat() {

      function escapeHtml(text) {
        return String(text)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function renderInlineMd(text) {
        let out = escapeHtml(text);
        out = out.replace(
          /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
          '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
        );
        out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        out = out.replace(/__([^_]+)__/g, "<strong>$1</strong>");
        out = out.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
        out = out.replace(/`([^`]+)`/g, "<code>$1</code>");
        return out;
      }

      function renderMarkdown(text) {
        const lines = String(text || "").replace(/\r\n/g, "\n").split("\n");
        const html = [];
        let listType = null;

        const closeList = () => {
          if (listType) {
            html.push(`</${listType}>`);
            listType = null;
          }
        };

        for (const raw of lines) {
          const line = raw.trimEnd();
          if (!line.trim()) {
            closeList();
            continue;
          }
          const heading = line.match(/^(#{1,6})\s+(.*)$/);
          if (heading) {
            closeList();
            const level = Math.min(heading[1].length + 2, 6);
            html.push(`<h${level}>${renderInlineMd(heading[2])}</h${level}>`);
            continue;
          }
          const ordered = line.match(/^\s*\d+[.)]\s+(.*)$/);
          const unordered = line.match(/^\s*[-*+]\s+(.*)$/);
          if (ordered) {
            if (listType !== "ol") {
              closeList();
              html.push("<ol>");
              listType = "ol";
            }
            html.push(`<li>${renderInlineMd(ordered[1])}</li>`);
            continue;
          }
          if (unordered) {
            if (listType !== "ul") {
              closeList();
              html.push("<ul>");
              listType = "ul";
            }
            html.push(`<li>${renderInlineMd(unordered[1])}</li>`);
            continue;
          }
          closeList();
          html.push(`<p>${renderInlineMd(line)}</p>`);
        }
        closeList();
        return html.join("");
      }

      function setAnswerContent(el, text) {
        el.innerHTML = renderMarkdown(text);
      }

      function addBubble(text, role, extraClass = "") {
        const empty = document.getElementById("empty");

        if (role === "agent") {
          const answer = document.createElement("div");
          answer.className = "answer-text";
          setAnswerContent(answer, text);
          el.appendChild(answer);
        } else {
          el.textContent = text;

        chat.appendChild(el);
        chat.scrollTop = chat.scrollHeight;
        return el;

        answer.className = "answer-text";
        setAnswerContent(answer, data.answer || "답변을 받지 못했습니다.");
        el.appendChild(answer);
        const plan = renderPlanCards(data);
        if (plan) el.appendChild(plan);
        if (

      function weatherIcon(condition, rain) {

        if (c.includes("구름")) return "⛅";
        if (c.includes("맑")) return "☀️";
        return "🌡️";
      }

      function formatWxDate(w) {
        if (w && w.date) {
          const parts = String(w.date).split("-");
          if (parts.length === 3) {
            const mo = parseInt(parts[1], 10);
            const dy = parseInt(parts[2], 10);
            if (!Number.isNaN(mo) && !Number.isNaN(dy)) {
              return `${mo}/${dy}${w.weekday ? `(${w.weekday})` : ""}`;

        }
        return w && w.day != null ? `Day${w.day}` : "";

      const MOOD_RULES = [
        {

        },

          emoji: "🎡",
          label: "액티비티·체험",
          grad: "linear-gradient(135deg, #4fa3a0, #3d8380)",
        },
        {

      function moodForDay(day) {
        const text = [
          day.theme || "",
          ...(day.slots || []).map((s) => `${s.place_name || ""} ${s.note || ""}`),
        ]
          .join(" ")
          .toLowerCase();
        for (const rule of MOOD_RULES) {
          if (rule.keys.some((k) => text.includes(k.toLowerCase()))) return rule;
        }
        return {
          emoji: "✨",
          label: "여행 감성",
          grad: "linear-gradient(135deg, #9cb4cc, #748da6)",
        };
      }

      function firstHex(grad) {
        const m = String(grad || "").match(/#[0-9a-fA-F]{3,6}/);
        return m ? m[0] : "#748da6";
      }

      function buildMoodBanner(day) {
        const mood = moodForDay(day);
        const banner = document.createElement("div");
        banner.className = "day-mood";
        banner.style.background = "linear-gradient(135deg, #9cb4cc, #748da6)";

        const accent = document.createElement("span");
        accent.className = "mood-accent";
        accent.style.background = firstHex(mood.grad);
        banner.appendChild(accent);

        const watermark = document.createElement("span");
        watermark.className = "mood-watermark";
        watermark.textContent = mood.emoji;
        watermark.setAttribute("aria-hidden", "true");
        banner.appendChild(watermark);

        const emoji = document.createElement("span");
        emoji.className = "mood-emoji";
        emoji.textContent = mood.emoji;
        emoji.setAttribute("aria-hidden", "true");

        const textWrap = document.createElement("div");
        textWrap.className = "mood-text";
        const label = document.createElement("span");
        label.className = "mood-label";
        label.textContent = mood.label;
        textWrap.appendChild(label);
        const subText = day.theme && day.theme !== mood.label ? day.theme : "";
        if (subText) {
          const sub = document.createElement("span");
          sub.className = "mood-sub";
          sub.textContent = subText;
          textWrap.appendChild(sub);
        }

        banner.appendChild(emoji);
        banner.appendChild(textWrap);
        return banner;
      }

      function buildDayBlock(day, weatherByDay, withRewrite) {
        const block = document.createElement("div");
        block.className = "day-block";

        const header = document.createElement("div");
        header.className = "day-header";
        const title = document.createElement("span");
        title.className = "day-title";
        title.textContent = `Day ${day.day}${day.theme ? ` · ${day.theme}` : ""}`;
        header.appendChild(title);
        const wx = weatherByDay[day.day];
        if (wx) {
          const badge = document.createElement("span");
          badge.className = "day-weather";
          const temp =
            wx.temp_min != null && wx.temp_max != null
              ? ` ${wx.temp_min}~${wx.temp_max}℃`
              : "";
          badge.textContent = `${weatherIcon(wx.condition, wx.rain)} ${wx.condition || ""}${temp}`;
          header.appendChild(badge);
        }
        block.appendChild(header);
        block.appendChild(buildMoodBanner(day));

        const body = document.createElement("div");
        body.className = "day-body";

        if (withRewrite) {
          const actions = document.createElement("div");
          actions.className = "day-actions";
          const rewrite = document.createElement("button");
          rewrite.type = "button";
          rewrite.className = "ghost-btn";
          rewrite.textContent = "이 날만 다시";
          rewrite.addEventListener("click", (event) => {
            event.stopPropagation();
            rewriteDay(day.day);
          });
          actions.appendChild(rewrite);
          body.appendChild(actions);
        }

        const timeline = document.createElement("div");
        timeline.className = "slot-timeline";
        (day.slots || []).forEach((slot, i) => {
          const row = document.createElement("div");
          row.className = "slot";
          row.style.animationDelay = `${Math.min(i * 0.06, 0.6)}s`;
          const time = document.createElement("div");
          time.className = "slot-time";
          time.textContent = SLOT_LABEL[slot.time] || slot.time || "";
          const place = document.createElement("button");
          place.type = "button";
          place.className = "slot-place";
          place.textContent = slot.place_name || "장소";
          if (slot.poi_id) {
            place.classList.add("clickable");
            place.dataset.poiId = slot.poi_id;
            place.addEventListener("click", () => openPlace(slot.poi_id));
          }
          row.appendChild(time);
          row.appendChild(place);
          if (slot.note) {
            const note = document.createElement("div");
            note.className = "slot-note";
            note.textContent = slot.note;
            row.appendChild(note);
          }
          timeline.appendChild(row);
        });
        body.appendChild(timeline);
        block.appendChild(body);
        return block;
      }

      function buildExportToolbar(data) {
        const toolbar = document.createElement("div");
        toolbar.className = "export-toolbar";
        const jsonBtn = document.createElement("button");
        jsonBtn.type = "button";
        jsonBtn.className = "export-btn";
        jsonBtn.title = "JSON으로 내보내기";
        jsonBtn.textContent = "⬇ JSON";
        jsonBtn.addEventListener("click", () => downloadPlan("json", data));
        const mdBtn = document.createElement("button");
        mdBtn.type = "button";
        mdBtn.className = "export-btn";
        mdBtn.title = "Markdown으로 내보내기";
        mdBtn.textContent = "⬇ MD";
        mdBtn.addEventListener("click", () => downloadPlan("md", data));
        toolbar.appendChild(jsonBtn);
        toolbar.appendChild(mdBtn);
        return toolbar;
      }

      function renderItineraryOptions(itineraries, weatherByDay, data) {
        const section = document.createElement("div");
        section.className = "itinerary-options";

        itineraries.forEach((opt, index) => {
          const optBlock = document.createElement("div");
          optBlock.className = "itinerary-block open";

          const toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "itinerary-toggle";
          toggle.setAttribute("aria-expanded", "true");
          const chevron = document.createElement("span");
          chevron.className = "day-chevron";
          chevron.textContent = "▶";
          chevron.setAttribute("aria-hidden", "true");
          const title = document.createElement("span");
          title.className = "day-title";
          title.textContent = `추천 ${index + 1}${opt.title ? ` · ${opt.title}` : ""}`;
          toggle.appendChild(chevron);
          toggle.appendChild(title);
          toggle.addEventListener("click", () => {
            const open = optBlock.classList.toggle("open");
            toggle.setAttribute("aria-expanded", open ? "true" : "false");
          });
          optBlock.appendChild(toggle);

          const optBody = document.createElement("div");
          optBody.className = "itinerary-body";
          for (const day of opt.days || []) {
            optBody.appendChild(buildDayBlock(day, weatherByDay, false));
          }
          optBlock.appendChild(optBody);
          section.appendChild(optBlock);
        });
        return section;
      }

      function buildAccommodations(accommodations) {
        const block = document.createElement("div");
        block.className = "stay-block";
        const label = document.createElement("div");
        label.className = "stay-title";
        label.textContent = "🏨 추천 숙소";
        block.appendChild(label);
        const list = document.createElement("ul");
        list.className = "stay-list";
        for (const a of accommodations) {
          const li = document.createElement("li");
          li.className = "stay-item";
          const name = document.createElement("span");
          name.className = "stay-name";
          name.textContent = a.place_name || "숙소";
          if (a.poi_id) {
            name.classList.add("clickable");
            name.title = "장소 상세 보기";
            name.addEventListener("click", () => openPlace(a.poi_id));
          }
          li.appendChild(name);
          const metaParts = [a.area, a.note].filter(Boolean);
          if (metaParts.length) {
            const meta = document.createElement("span");
            meta.className = "stay-meta";
            meta.textContent = ` — ${metaParts.join(" · ")}`;
            li.appendChild(meta);
          }
          list.appendChild(li);
        }
        block.appendChild(list);
        return block;
      }

      function renderPlanCards(data) {
        const itinerary = data.itinerary || [];
        const itineraries = data.itineraries || [];
        const accommodations = data.accommodations || [];
        const cities = data.cities || [];
        const warnings = data.warnings || [];
        const sources = data.sources || [];
        const realtime = data.realtime || {};
        const weather = realtime.weather || [];
        const weatherByDay = {};
        for (const w of weather) weatherByDay[w.day] = w;
        if (
          !itinerary.length &&
          !itineraries.length &&
          !accommodations.length &&
          !cities.length &&
          !warnings.length &&
          !sources.length &&
          !weather.length
        )
          return null;

        const wrap = document.createElement("div");
        wrap.className = "plan";

        if (weather.length) {
          const strip = document.createElement("div");
          strip.className = "weather-strip";
          for (const w of weather) {
            const chip = document.createElement("div");
            chip.className = "weather-chip" + (w.rain ? " rain" : "");
            const icon = document.createElement("span");
            icon.className = "wx-icon";
            icon.textContent = weatherIcon(w.condition, w.rain);
            const label = document.createElement("span");
            const day = document.createElement("span");
            day.className = "wx-day";
            day.textContent = formatWxDate(w);
            const cond = document.createTextNode(` ${w.condition || ""}`);
            label.appendChild(day);
            label.appendChild(cond);
            chip.appendChild(icon);
            chip.appendChild(label);
            if (w.temp_min != null && w.temp_max != null) {
              const temp = document.createElement("span");
              temp.className = "wx-temp";
              temp.textContent = `${w.temp_min}~${w.temp_max}℃`;
              chip.appendChild(temp);
            }
            if (w.pop != null) {
              const pop = document.createElement("span");
              pop.className = "wx-temp";
              pop.textContent = `☔${w.pop}%`;
              chip.appendChild(pop);
            }
            chip.title = w.date ? `${w.date} (${w.weekday})` : "";
            strip.appendChild(chip);
          }
          wrap.appendChild(strip);
        }

        if (cities.length) {
          const list = document.createElement("ol");
          list.className = "city-list";
          for (const c of cities) {
            const li = document.createElement("li");
            li.className = "city-item";

            const head = document.createElement("div");
            head.className = "city-head";
            const name = document.createElement("span");
            name.className = "city-name";
            name.textContent = c.region && c.region !== c.city
              ? `${c.city} · ${c.region}`
              : c.city;
            head.appendChild(name);
            li.appendChild(head);

            if (c.merit) {
              const merit = document.createElement("div");
              merit.className = "city-merit";
              merit.textContent = c.merit;
              li.appendChild(merit);
            }

            const places = c.places || [];
            const chips = document.createElement("div");
            chips.className = "city-places";
            if (!places.length) {
              const dash = document.createElement("span");
              dash.className = "city-place-empty";
              dash.textContent = "-";
              chips.appendChild(dash);
            } else {
              for (const p of places.slice(0, 3)) {
                const chip = document.createElement("span");
                chip.className = "source-chip";
                chip.textContent = p.place_name || "장소";
                if (p.poi_id) {
                  chip.classList.add("clickable");
                  chip.title = "장소 상세 보기";
                  chip.addEventListener("click", () => openPlace(p.poi_id));
                }
                chips.appendChild(chip);
              }
            }
            li.appendChild(chips);
            list.appendChild(li);
          }
          wrap.appendChild(list);
        }

        if (itineraries.length) {
          wrap.appendChild(renderItineraryOptions(itineraries, weatherByDay, data));
        } else if (itinerary.length) {
          const itinBlock = document.createElement("div");
          itinBlock.className = "itinerary-block open";

          const itinToggle = document.createElement("button");
          itinToggle.type = "button";
          itinToggle.className = "itinerary-toggle";
          itinToggle.setAttribute("aria-expanded", "true");
          itinToggle.setAttribute("aria-label", "전체 일정 펼치기/접기");
          const itinChevron = document.createElement("span");
          itinChevron.className = "day-chevron";
          itinChevron.textContent = "▶";
          itinChevron.setAttribute("aria-hidden", "true");
          const itinTitle = document.createElement("span");
          itinTitle.className = "day-title";
          itinTitle.textContent = "전체 일정";
          itinToggle.appendChild(itinChevron);
          itinToggle.appendChild(itinTitle);
          itinToggle.addEventListener("click", () => {
            const open = itinBlock.classList.toggle("open");
            itinToggle.setAttribute("aria-expanded", open ? "true" : "false");
          });
          itinBlock.appendChild(itinToggle);

          const itinBody = document.createElement("div");
          itinBody.className = "itinerary-body";
          for (const day of itinerary) {
            itinBody.appendChild(buildDayBlock(day, weatherByDay, true));
          }
          itinBlock.appendChild(itinBody);
          wrap.appendChild(itinBlock);
        }

        if (accommodations.length) {
          wrap.appendChild(buildAccommodations(accommodations));
        }

        if (warnings.length) {
          const box = document.createElement("div");
          box.className = "warnings";
          box.innerHTML = "<strong>주의</strong>";
          const ul = document.createElement("ul");
          for (const w of warnings) {
            const li = document.createElement("li");
            li.textContent = w;
            ul.appendChild(li);
          }
          box.appendChild(ul);
          wrap.appendChild(box);
        }

        const usedPoiIds = new Set();
        const dayGroups = itineraries.length
          ? itineraries.flatMap((opt) => opt.days || [])
          : itinerary;
        for (const day of dayGroups) {
          for (const slot of day.slots || []) {
            if (slot.poi_id) usedPoiIds.add(String(slot.poi_id));
          }
        }
        const seenAlt = new Set();
        const altPlaces = [];
        // Only for itinerary mode; city-list already shows places per city.
        if (!cities.length) {
          for (const s of sources) {
            if (s.type && s.type !== "poi") continue;
            if (!s.id || !s.name) continue;
            const id = String(s.id);
            if (usedPoiIds.has(id) || seenAlt.has(id)) continue;
            seenAlt.add(id);
            altPlaces.push(s);
          }
        }

        if (altPlaces.length) {
          const label = document.createElement("div");
          label.className = "session-meta";
          label.textContent = "같은 지역 다른 추천 장소";
          const list = document.createElement("ul");
          list.className = "sources";
          for (const s of altPlaces) {
            const li = document.createElement("li");
            li.className = "source-chip clickable";
            li.textContent = s.name;
            li.title = "장소 상세 보기";
            li.addEventListener("click", () => openPlace(s.id));
            list.appendChild(li);
          }
          wrap.appendChild(label);
          wrap.appendChild(list);
        }

        if (itinerary.length || itineraries.length) {
          wrap.appendChild(buildExportToolbar(data));
        }

        return wrap;
      }

      function daysToMarkdown(lines, days, headingLevel) {
        const prefix = "#".repeat(headingLevel);
        for (const day of days || []) {
          lines.push(`${prefix} Day ${day.day}${day.theme ? ` — ${day.theme}` : ""}`);
          for (const slot of day.slots || []) {
            const when = SLOT_LABEL[slot.time] || slot.time || "";
            lines.push(`- **${when}**: ${slot.place_name || ""}${slot.note ? ` — ${slot.note}` : ""}`);
          }
          lines.push("");
        }
      }

      function itineraryToMarkdown(data) {
        const lines = [];
        if (data.destination) lines.push(`# ${data.destination} 여행`);
        else lines.push("# 여행 일정");
        if (data.days) lines.push(`\n${data.days}일 일정\n`);
        if (data.answer) {
          lines.push("## 요약");
          lines.push(data.answer);
          lines.push("");
        }
        const options = data.itineraries || [];
        if (options.length) {
          options.forEach((opt, index) => {
            lines.push(`## 추천 ${index + 1}${opt.title ? ` — ${opt.title}` : ""}`);
            lines.push("");
            daysToMarkdown(lines, opt.days, 3);
          });
        } else {
          daysToMarkdown(lines, data.itinerary, 2);
        }
        if ((data.accommodations || []).length) {
          lines.push("## 추천 숙소");
          for (const a of data.accommodations) {
            const meta = [a.area, a.note].filter(Boolean).join(" · ");
            lines.push(`- ${a.place_name || ""}${meta ? ` — ${meta}` : ""}`);
          }
          lines.push("");
        }
        if ((data.warnings || []).length) {
          lines.push("## 주의");
          for (const w of data.warnings) lines.push(`- ${w}`);
        }
        return lines.join("\n");
      }

      function downloadPlan(format, data) {
        const plan = data || latestPlan;
        if (
          !plan ||
          (!(plan.itinerary || []).length && !(plan.itineraries || []).length)
        )
          return;
        let content;
        let filename;
        let mime;
        if (format === "md") {
          content = itineraryToMarkdown(plan);
          filename = "itinerary.md";
          mime = "text/markdown;charset=utf-8";
        } else {
          content = JSON.stringify(plan, null, 2);
          filename = "itinerary.json";
          mime = "application/json;charset=utf-8";
        }
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      }

      function renderMessages(messages) {
        chat.innerHTML = "";
        latestPlan = null;
        if (!messages || messages.length === 0) {
          clearChat();
          return;
        }
        for (const message of messages) {
          if (message.role === "user") {
            addBubble(message.content, "user");
            continue;
          }
          const el = addBubble(message.content || "", "agent");
          const payload = message.payload || {};
          if (
            payload.itinerary ||
            payload.itineraries ||
            payload.accommodations ||
            payload.cities ||
            payload.warnings ||
            payload.sources ||
            (payload.realtime && payload.realtime.weather)
          ) {
            fillAgentBubble(el, {
              answer: message.content,
              ...payload,
            });
          }
        }
      }

      function formatMeta(session) {
        const parts = [];
        if (session.destination) parts.push(session.destination);
        if (session.days) parts.push(`${session.days}일`);
        if (typeof session.message_count === "number") {
          parts.push(`메시지 ${session.message_count}`);
        }
        return parts.join(" · ") || "새 대화";
      }

      function fillMetaForm(session) {
        if (!session) return;
        document.getElementById("metaTitle").value = session.title || "";
        document.getElementById("metaDestination").value = session.destination || "";
        document.getElementById("metaDays").value = session.days ?? "";
        document.getElementById("metaBudget").value = session.budget ?? "";
        document.getElementById("metaLanguage").value = session.language || "ko";
        document.getElementById("metaPreferences").value = (session.preferences || []).join(", ");
      }

      function renderSessions(sessions) {
        sessionList.innerHTML = "";
        if (!sessions.length) {
          const empty = document.createElement("div");
          empty.className = "session-meta";
          empty.style.padding = "8px";
          empty.textContent = "아직 세션이 없습니다.";
          sessionList.appendChild(empty);
          return;
        }

        for (const session of sessions) {
          const row = document.createElement("div");
          row.className =
            "session-item" +
            (session.id === currentSessionId ? " active" : "");

          const main = document.createElement("button");
          main.type = "button";
          main.style.all = "unset";
          main.style.cursor = "pointer";
          main.style.display = "block";
          main.style.width = "100%";
          main.innerHTML = `
            <div class="session-title"></div>
            <div class="session-meta"></div>
          `;
          main.querySelector(".session-title").textContent = session.title;
          main.querySelector(".session-meta").textContent = formatMeta(session);
          main.addEventListener("click", () => selectSession(session.id));

          const del = document.createElement("button");
          del.type = "button";
          del.className = "session-delete";
          del.textContent = "삭제";
          del.addEventListener("click", (event) => {
            event.stopPropagation();
            deleteSession(session.id, session.title);
          });

          row.appendChild(main);
          row.appendChild(del);
          sessionList.appendChild(row);
        }
      }

      async function refreshSessions() {
        const response = await fetch("/travel/sessions");
        if (!response.ok) throw new Error("세션 목록을 불러오지 못했습니다.");
        const sessions = await response.json();
        renderSessions(sessions);
        return sessions;
      }

      function applySessionHeader(session) {
        currentSession = session;
        subtitle.textContent = session.destination
          ? `${session.title} · ${session.destination}`
          : session.title;
        toggleMeta.hidden = false;
        fillMetaForm(session);
      }

      async function selectSession(sessionId, options = {}) {
        const force = Boolean(options.force);
        if (busy && !force) return;
        currentSessionId = sessionId;
        localStorage.setItem("travelSessionId", sessionId);
        setBusy(true);
        try {
          const response = await fetch(`/travel/sessions/${sessionId}`);
          if (!response.ok) throw new Error("세션을 불러오지 못했습니다.");
          const detail = await response.json();
          if (currentSessionId !== sessionId) return;
          applySessionHeader(detail);
          renderMessages(detail.messages || []);
          await refreshSessions();
        } catch (error) {
          if (currentSessionId !== sessionId) return;
          clearChat();
          addBubble(
            error instanceof Error ? error.message : "세션 로드 실패",
            "agent",
            "error"
          );
        } finally {
          if (currentSessionId === sessionId) {
            setBusy(false);
            input.focus();
          }
        }
      }

      async function createSession() {
        if (busy) return;
        setBusy(true);
        try {
          const response = await fetch("/travel/sessions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({}),
          });
          if (!response.ok) throw new Error("세션 생성 실패");
          const session = await response.json();
          currentSessionId = session.id;
          localStorage.setItem("travelSessionId", session.id);
          applySessionHeader(session);
          metaEditor.classList.remove("open");
          clearChat();
          await refreshSessions();
        } catch (error) {
          addBubble(
            error instanceof Error ? error.message : "세션 생성 실패",
            "agent",
            "error"
          );
        } finally {
          setBusy(false);
          input.focus();
        }
      }

      async function deleteSession(sessionId, title) {
        if (busy) return;
        const ok = window.confirm(`"${title}" 세션을 삭제할까요?`);
        if (!ok) return;
        setBusy(true);
        try {
          const response = await fetch(`/travel/sessions/${sessionId}`, {
            method: "DELETE",
          });
          if (!response.ok) throw new Error("세션 삭제 실패");
          if (currentSessionId === sessionId) {
            currentSessionId = null;
            currentSession = null;
            localStorage.removeItem("travelSessionId");
            subtitle.textContent = "여행별로 대화를 나눠 이어갈 수 있습니다.";
            toggleMeta.hidden = true;
            metaEditor.classList.remove("open");
            clearChat();
          }
          const sessions = await refreshSessions();
          if (!currentSessionId && sessions.length) {
            await selectSession(sessions[0].id, { force: true });
          } else {
            setBusy(false);
          }
        } catch (error) {
          addBubble(
            error instanceof Error ? error.message : "세션 삭제 실패",
            "agent",
            "error"
          );
          setBusy(false);
        }
      }

      toggleMeta.addEventListener("click", () => {
        metaEditor.classList.toggle("open");
        if (currentSession) fillMetaForm(currentSession);
      });
      cancelMeta.addEventListener("click", () => metaEditor.classList.remove("open"));

      metaEditor.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!currentSessionId || busy) return;
        const prefsRaw = document.getElementById("metaPreferences").value.trim();
        const preferences = prefsRaw
          ? prefsRaw.split(",").map((s) => s.trim()).filter(Boolean)
          : [];
        const daysVal = document.getElementById("metaDays").value;
        const budgetVal = document.getElementById("metaBudget").value;
        const body = {
          title: document.getElementById("metaTitle").value.trim() || null,
          destination: document.getElementById("metaDestination").value.trim() || null,
          days: daysVal ? Number(daysVal) : null,
          budget: budgetVal ? Number(budgetVal) : null,
          language: document.getElementById("metaLanguage").value || "ko",
          preferences,
        };
        setBusy(true);
        try {
          const response = await fetch(`/travel/sessions/${currentSessionId}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!response.ok) throw new Error("세션 저장 실패");
          const session = await response.json();
          applySessionHeader(session);
          metaEditor.classList.remove("open");
          await refreshSessions();
        } catch (error) {
          addBubble(
            error instanceof Error ? error.message : "세션 저장 실패",
            "agent",
            "error"
          );
        } finally {
          setBusy(false);
        }
      });

      function openDrawer() {
        drawer.classList.add("open");
        drawerBackdrop.classList.add("open");
        drawer.setAttribute("aria-hidden", "false");
      }

      function closePlaceDrawer() {
        drawer.classList.remove("open");
        drawerBackdrop.classList.remove("open");
        drawer.setAttribute("aria-hidden", "true");
      }

      closeDrawer.addEventListener("click", closePlaceDrawer);
      drawerBackdrop.addEventListener("click", closePlaceDrawer);

      async function openPlace(poiId) {
        placeTitle.textContent = "불러오는 중…";
        placeBody.innerHTML = "";
        openDrawer();
        try {
          const response = await fetch(`/travel/places/${encodeURIComponent(poiId)}`);
          if (!response.ok) throw new Error("장소 정보를 찾을 수 없습니다.");
          const place = await response.json();
          placeTitle.textContent =
            place.name_ko || place.name_en || place.poi_id || "장소 상세";
          const fields = [
            ["유형", place.travel_type],
            ["지역", [place.region, place.city].filter(Boolean).join(" · ")],
            ["주소", place.address_ko || place.address_en],
            ["전화", place.phone],
            ["운영시간", place.hours_ko || place.hours_en],
            ["휴무", place.closed_ko],
            ["요금", place.fee_ko || place.fee_en],
            ["주차", place.parking_ko],
            ["홈페이지", place.homepage],
            ["체크인", place.checkin],
            ["체크아웃", place.checkout],
            ["출처", place.source],
          ];
          placeBody.innerHTML = "";
          for (const [label, value] of fields) {
            if (!value) continue;
            const dt = document.createElement("dt");
            dt.textContent = label;
            const dd = document.createElement("dd");
            if (label === "홈페이지" && String(value).startsWith("http")) {
              const a = document.createElement("a");
              a.href = value;
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              a.textContent = value;
              dd.appendChild(a);
            } else {
              dd.textContent = value;
            }
            placeBody.appendChild(dt);
            placeBody.appendChild(dd);
          }
        } catch (error) {
          placeTitle.textContent = "오류";
          placeBody.innerHTML = "";
          const dd = document.createElement("dd");
          dd.textContent =
            error instanceof Error ? error.message : "장소 로드 실패";
          placeBody.appendChild(dd);
        }
      }

      function sessionQueryBody(question, extra = {}) {
        const body = { question, ...extra };
        if (currentSession) {
          if (currentSession.destination) body.destination = currentSession.destination;
          if (currentSession.days) body.days = currentSession.days;
          if (currentSession.budget != null) body.budget = currentSession.budget;
          if (currentSession.language) body.language = currentSession.language;
          if (currentSession.preferences && currentSession.preferences.length) {
            body.preferences = currentSession.preferences;
          }
        }
        return body;
      }

      async function rewriteDay(day) {
        if (!currentSessionId || busy) return;
        const question = `${day}일차만 바꿔줘`;
        addBubble(question, "user");
        await runStreamQuery(question, { rewrite_day: day });
      }

      async function parseSseStream(response, handlers) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const chunks = buffer.split("\n\n");
          buffer = chunks.pop() || "";
          for (const chunk of chunks) {
            const lines = chunk.split("\n");
            let event = "message";
            const dataLines = [];
            for (const line of lines) {
              if (line.startsWith("event:")) event = line.slice(6).trim();
              else if (line.startsWith("data:")) dataLines.push(line.slice(5).trim());
            }
            if (!dataLines.length) continue;
            let data;
            try {
              data = JSON.parse(dataLines.join("\n"));
            } catch {
              continue;
            }
            if (handlers[event]) handlers[event](data);
          }
        }
      }

      async function runStreamQuery(question, extra = {}) {
        setBusy(true);
        const pending = addBubble("", "agent", "typing");
        const answerEl = pending.querySelector(".answer-text");
        const stepper = buildTypingStepper();
        pending.insertBefore(stepper, answerEl);
        let sawToken = false;

        try {
          const response = await fetch(
            `/travel/sessions/${currentSessionId}/query/stream`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(sessionQueryBody(question, extra)),
            }
          );
          if (!response.ok) throw new Error(`요청 실패 (${response.status})`);

          await parseSseStream(response, {
            status: (data) => {
              if (!sawToken) setStepperStage(stepper, data.stage);
            },
            token: (data) => {
              if (!answerEl) return;
              if (!sawToken) {
                stepper.remove();
                answerEl.textContent = "";
                sawToken = true;
                pending.classList.remove("typing");
              }
              answerEl.textContent += data.text || "";
              chat.scrollTop = chat.scrollHeight;
            },
            done: (data) => {
              fillAgentBubble(pending, data);
              if (data.session) applySessionHeader(data.session);
              if (
                (data.itinerary && data.itinerary.length) ||
                (data.itineraries && data.itineraries.length)
              ) {
                fireConfetti();
              }
            },
            error: (data) => {
              throw new Error(data.message || "스트리밍 오류");
            },
          });
          await refreshSessions();
        } catch (error) {
          pending.classList.remove("typing");
          pending.classList.add("error");
          pending.innerHTML = "";
          const answer = document.createElement("div");
          answer.className = "answer-text";
          answer.textContent =
            error instanceof Error
              ? `오류: ${error.message}`
              : "알 수 없는 오류가 발생했습니다.";
          pending.appendChild(answer);
        } finally {
          setBusy(false);
          input.focus();
          chat.scrollTop = chat.scrollHeight;
        }
      }

      newSessionBtn.addEventListener("click", createSession);

      chat.addEventListener("click", (event) => {
        const chip = event.target.closest(".example-chip");
        if (!chip || busy) return;
        input.value = chip.dataset.q || chip.textContent || "";
        input.focus();
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const question = input.value.trim();
        if (!question || busy) return;

        if (!currentSessionId) {
          await createSession();
          if (!currentSessionId) return;
        }

        addBubble(question, "user");
        input.value = "";
        await runStreamQuery(question);
      });

      (async function init() {
        try {
          const sessions = await refreshSessions();
          if (
            currentSessionId &&
            sessions.some((session) => session.id === currentSessionId)
          ) {
            await selectSession(currentSessionId, { force: true });
          } else if (sessions.length) {
            await selectSession(sessions[0].id, { force: true });
          } else {
            currentSessionId = null;
            clearChat();
            setBusy(false);
          }
        } catch (error) {
          addBubble(
            error instanceof Error ? error.message : "초기화 실패",
            "agent",
            "error"
          );
          setBusy(false);
        }
      })();
    </script>
  </body>
</html>
